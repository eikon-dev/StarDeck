services:
  api:
    image: ghcr.io/eikon-dev/stardeck-api:latest
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - TG_BOT_SECRET_KEY=${TG_BOT_SECRET_KEY}
      - NODE_ENV=production
      - PORT=3001

  web:
    image: ghcr.io/eikon-dev/stardeck-web:latest
    environment:
      - API_URL=http://api:3001
    depends_on:
      - api

  caddy:
    image: caddy:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config: